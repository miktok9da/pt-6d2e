name: Daily Auto Shorts with Multi-Platform Upload

on:
  schedule:
    - cron: "9 6 * * *"
    - cron: "25 11 * * *"
    - cron: "52 15 * * *"
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Cache Vosk Model
      uses: actions/cache@v4
      with:
        path: vosk-model-small-pt-0.3
        key: vosk-model-small-pt-0.3

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check and generate topics if needed
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      run: |
        python generate_topics.py

    - name: Generate daily short video
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      run: |
        python main.py

    - name: Upload to all platforms
      env:
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      run: |
        python upload_all_platforms.py

    - name: Commit updated topics and tracking files
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Abort if any file got corrupted with merge-conflict markers (never commit garbage)
        if grep -rlE '^(<<<<<<<|=======|>>>>>>>)' topics.txt used_topics.txt used_images.json output/ 2>/dev/null; then
          echo "ERROR: conflict markers found in tracked files, refusing to commit"
          exit 1
        fi
        # Only track & commit JSON tracking files if they are valid JSON
        python - <<'PYEOF'
import json, os, sys
for f in ["used_images.json"]:
    if os.path.exists(f):
        try:
            json.load(open(f, encoding="utf-8"))
        except Exception as e:
            print(f"WARNING: {f} is invalid JSON, skipping staging: {e}")
            try: os.remove(f)
            except OSError: pass
PYEOF
        git add topics.txt used_topics.txt used_images.json output/story_en.txt 2>/dev/null || true
        # Rebase onto latest remote, auto-stash local changes; if conflict, abort and keep going
        git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; echo "WARNING: rebase failed, committing anyway"; }
        # Never commit files that contain conflict markers
        if git diff --cached --name-only | xargs grep -lE '^(<<<<<<<|=======|>>>>>>>)' 2>/dev/null; then
          echo "WARNING: staged files contain conflict markers, un-staging them"
          git diff --cached --name-only | xargs -r git reset -q --
        fi
        git diff --staged --quiet || git commit -m "🔄 Auto-update: Track used topics and images [skip ci]"
        git push || { sleep 5; git push; } || true
